apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: research-worker
  template:
    metadata:
      labels:
        app: research-worker
    spec:
      containers:
        - name: research-worker
          image: myapp-backend:latest
          imagePullPolicy: Never
          command: ["python", "worker_server.py", "60201"]
          ports:
            - containerPort: 60201
---
apiVersion: v1
kind: Service
metadata:
  name: worker-svc
spec:
  clusterIP: None  # Headless Service for gRPC Round Robin Load Balancing!
  selector:
    app: research-worker
  ports:
    - port: 60201
      targetPort: 60201
